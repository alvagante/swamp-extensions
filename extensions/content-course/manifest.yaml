manifestVersion: 1
name: "@alvagante/content-course"
version: "2026.07.12.1"
description: "Persist grounded openskills.info mini courses and optional composed infographics into courses/<discipline>/<topic-slug>/. Content is authored and verified by the calling agent; this extension performs no inference."
repository: "https://github.com/alvagante/swamp-extensions"
models:
  - content_course.ts
additionalFiles:
  - README.md
  - LICENSE.txt
platforms:
  - linux-x86_64
  - darwin-aarch64
labels:
  - content
  - course
  - education
  - markdown
  - yaml
  - ai
  - infographic
