manifestVersion: 1
name: "@alvagante/content-infographic"
version: "2026.07.15.1"
description: "Generate browser-ready infographic pages using OpenAI image generation. Produces an image and, optionally, a reliable HTML text shell suitable for embedding in @alvagante/content-ixen (set emitHtml: false to skip the HTML file)."
repository: "https://github.com/alvagante/swamp-extensions"
paths:
  base: manifest
models:
  - extensions/models/content_infographic.ts
additionalFiles:
  - README.md
  - LICENSE.txt
platforms:
  - linux-x86_64
  - darwin-aarch64
labels:
  - content
  - infographic
  - image
  - html
  - openai
  - ai
